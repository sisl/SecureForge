# Terra Pipeline — Step 1: Generate
# Generate 10 scenarios x 10 rollouts per CWE with the standard prompt.
# Uses the same Semgrep protocol and defaults as the tunable sweeps.
#
# Usage:
#   sf sweep generate -r config/sweeps/terra/generate.yaml

defaults:
  - min_samples=10
  - num_rollouts=10

runs:
  - name: gpt-5.6-terra
    overrides:
      - model=openai/gpt-5.6-terra
    api_key_env: OPENAI_API_KEY
