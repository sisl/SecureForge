# Terra Pipeline — Step 4: Generate
# Repeat the 10x10 generation with Terra's GEPA-optimized prompt.
# Uses the same Semgrep protocol and defaults as the tunable sweeps.
#
# Usage:
#   sf sweep generate -r config/sweeps/terra/generate_prompt_optimized.yaml

defaults:
  - min_samples=10
  - num_rollouts=10

runs:
  - name: gepa-gpt-5.6-terra
    overrides:
      - model=openai/gpt-5.6-terra
      - coder_prompt=./output/sweeps/optimize_gepa_gpt_5.6_terra_t1p0.json
      - output_dir=./output/sweeps/gepa/
    api_key_env: OPENAI_API_KEY
