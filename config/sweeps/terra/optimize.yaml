# Terra Pipeline — Step 3: Optimize
# GEPA prompt optimization using Terra's amplified scenarios.
# Uses the same Semgrep protocol and defaults as the tunable sweeps.
#
# Usage:
#   sf sweep optimize -r config/sweeps/terra/optimize.yaml

defaults: []

runs:
  - name: gepa-gpt-5.6-terra
    overrides:
      - model=openai/gpt-5.6-terra
      - method=gepa
      - input_file=./output/sweeps/amplify_gpt_5.6_terra_t0p8.jsonl
      - output=./output/sweeps/optimize_gepa_gpt_5.6_terra_t1p0.json
    api_key_env: OPENAI_API_KEY
